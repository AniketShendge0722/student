
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | SchoolTrack'">SchoolTrack</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div th:replace="~{fragments/topbar :: topbar(${pageTitle})}"></div>

        <section class="page-content">
            <div th:replace="${content}"></div>
        </section>

        <footer class="developer-footer">
            <div class="developer-footer-content">

                <div class="developer-footer-brand">
                    <strong>SchoolTrack</strong>
                    <span>Student Management System</span>
                </div>

                <div class="developer-footer-credit">
                    <span>Designed &amp; Developed by</span>
                    <strong>Aniket Shendge</strong>
                    <small>Java Developer | Spring Boot | MySQL | Web Development</small>
                </div>

                <div class="developer-footer-contact">
                    <a href="mailto:aniketshedge50@gmail.com">
                        <i class="fa-solid fa-envelope"></i>
                        aniketshedge50@gmail.com
                    </a>

                    <a href="tel:+918466071140">
                        <i class="fa-solid fa-phone"></i>
                        +91 84660 71140
                    </a>
                </div>

            </div>

            <div class="developer-footer-bottom">
                <span>&copy; 2026 SchoolTrack. All rights reserved.</span>
                <span>Built with Java &amp; Spring Boot</span>
            </div>
        </footer>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
