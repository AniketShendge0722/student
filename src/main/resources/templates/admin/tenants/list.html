<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Management | SchoolTrack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div th:replace="~{fragments/topbar :: topbar('Tenant Management')}"></div>

        <section class="page-content">

            <div class="page-header">
                <div>
                    <h1>Tenant Management</h1>
                    <p>Manage schools registered in SchoolTrack.</p>
                </div>

                <a th:href="@{/admin/tenants/new}" class="btn btn-primary">
                    + Add New School
                </a>
            </div>

            <div th:if="${successMessage}"
                 class="alert alert-success"
                 role="alert"
                 th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${errorMessage}">
            </div>

            <div class="card">

                <div class="card-header">
                    <h2>Registered Schools</h2>
                    <span th:text="${#lists.size(tenants)} + ' school(s)'"></span>
                </div>

                <div class="table-responsive">

                    <table class="table">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>School Name</th>
                            <th>School Code</th>
                            <th>Contact Email</th>
                            <th>Contact Phone</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="tenant, iter : ${tenants}">

                            <td th:text="${iter.count}"></td>

                            <td>
                                <strong th:text="${tenant.tenantName}"></strong>
                                <div class="text-muted"
                                     th:if="${tenant.address != null}"
                                     th:text="${tenant.address}">
                                </div>
                            </td>

                            <td th:text="${tenant.tenantCode}"></td>

                            <td th:text="${tenant.contactEmail != null
                                ? tenant.contactEmail : '-'}"></td>

                            <td th:text="${tenant.contactPhone != null
                                ? tenant.contactPhone : '-'}"></td>

                            <td>
                                <span th:if="${tenant.active}"
                                      class="badge badge-success">
                                    Active
                                </span>

                                <span th:unless="${tenant.active}"
                                      class="badge badge-danger">
                                    Inactive
                                </span>
                            </td>

                            <td th:text="${tenant.createdAt != null
                                ? #temporals.format(tenant.createdAt, 'dd-MM-yyyy HH:mm')
                                : '-'}"></td>

                            <td>
                                <div class="action-buttons">

                                    <!-- Edit School -->
                                    <a th:href="@{/admin/tenants/{id}/edit(id=${tenant.id})}"
                                       class="btn btn-sm btn-secondary">
                                        Edit
                                    </a>

                                    <!-- Deactivate Active School -->
                                    <form th:if="${tenant.active}"
                                          th:action="@{/admin/tenants/{id}/status(id=${tenant.id})}"
                                          method="post"
                                          class="inline-form"
                                          onsubmit="return confirm('Are you sure you want to deactivate this school?');">

                                        <input type="hidden"
                                               name="active"
                                               value="false">

                                        <button type="submit"
                                                class="btn btn-danger btn-small">
                                            Deactivate
                                        </button>
                                    </form>

                                    <!-- Activate Inactive School -->
                                    <form th:unless="${tenant.active}"
                                          th:action="@{/admin/tenants/{id}/status(id=${tenant.id})}"
                                          method="post"
                                          class="inline-form"
                                          onsubmit="return confirm('Are you sure you want to activate this school?');">

                                        <input type="hidden"
                                               name="active"
                                               value="true">

                                        <button type="submit"
                                                class="btn btn-primary btn-small">
                                            Activate
                                        </button>
                                    </form>

                                </div>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(tenants)}">
                            <td colspan="8" class="text-center">
                                No schools found.
                                <a th:href="@{/admin/tenants/new}">
                                    Create the first school
                                </a>.
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>

        </section>

            <div th:replace="~{fragments/footer :: developerFooter}"></div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
