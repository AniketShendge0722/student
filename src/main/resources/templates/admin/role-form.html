
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | SchoolTrack'">Create Role</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div th:replace="~{fragments/topbar :: topbar('Roles Management')}"></div>

        <section class="page-content">

            <div class="welcome-row">
                <div>
                    <h2 th:text="${pageTitle}">Create Role</h2>
                    <p class="muted">
                        Enter the role details below.
                    </p>
                </div>
            </div>

            <section class="panel form-panel">

                <div th:if="${businessError}"
                     class="alert alert-danger"
                     th:text="${businessError}">
                </div>

                <form method="post"
                      th:action="${formAction}"
                      th:object="${roleForm}">

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="roleName">
                                Role Name *
                            </label>

                            <input type="text"
                                   id="roleName"
                                   th:field="*{roleName}"
                                   placeholder="Example: School Manager"
                                   maxlength="50"
                                   required>

                            <small class="muted">
                                Example: School Manager becomes ROLE_SCHOOL_MANAGER.
                            </small>

                            <small class="field-error"
                                   th:if="${#fields.hasErrors('roleName')}"
                                   th:errors="*{roleName}">
                                Invalid role name
                            </small>

                        </div>

                        <div class="form-group">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      maxlength="300"
                                      placeholder="Describe the purpose of this role">
                            </textarea>

                            <small class="field-error"
                                   th:if="${#fields.hasErrors('description')}"
                                   th:errors="*{description}">
                                Invalid description
                            </small>

                        </div>

                    </div>

                    <div class="form-actions">

                        <button type="submit"
                                class="btn btn-primary">
                            Save Role
                        </button>

                        <a th:href="@{/admin/roles}"
                           class="btn btn-light">
                            Cancel
                        </a>

                    </div>

                </form>

            </section>

        </section>

    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
