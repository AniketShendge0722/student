
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div th:replace="~{fragments/topbar :: topbar('Reset Password')}"></div>

        <section class="page-content">

            <div class="welcome-row">
                <div>
                    <h2>Reset Password</h2>
                    <p class="muted">
                        Set a new password for this user account.
                    </p>
                </div>

                <a th:href="@{/admin/users}" class="btn btn-light">
                    Back to Users
                </a>
            </div>

            <div th:if="${successMessage}"
                 class="alert alert-success"
                 th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-error"
                 th:text="${errorMessage}">
            </div>

            <div class="panel">

                <div class="panel-heading">
                    <div>
                        <h3 th:text="|Reset password for ${targetUser.username}|">
                            Reset Password
                        </h3>

                        <p class="muted">
                            Enter a new password of at least 8 characters.
                        </p>
                    </div>
                </div>

                <form th:action="@{/admin/users/reset-password/{id}(id=${targetUser.id})}"
                      method="post" data-validate="true">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="newPassword">New Password</label>

                            <input type="password"
                                   id="newPassword"
                                   name="newPassword"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   placeholder="Enter new password"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">
                                Confirm New Password
                            </label>

                            <input type="password"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   placeholder="Confirm new password"
                                   required>
                        </div>

                    </div>

                    <div class="form-actions">

                        <a th:href="@{/admin/users}"
                           class="btn btn-light">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-primary">
                            Update Password
                        </button>

                    </div>

                </form>

            </div>

        </section>

            <div th:replace="~{fragments/footer :: developerFooter}"></div>
    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
