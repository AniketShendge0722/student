<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar('User Management')}"></div>

        <section class="page-content">

            <div class="welcome-row">
                <div>
                    <h2>User Management</h2>
                    <p class="muted">Create users and manage their school access and roles.</p>
                </div>
                <a th:href="@{/admin/users/create}" class="btn btn-primary">
                    + Create User
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success"
                 th:text="${successMessage}"></div>

            <div th:if="${errorMessage}" class="alert alert-error"
                 th:text="${errorMessage}"></div>

            <div class="panel table-panel">
                <div class="panel-heading">
                    <div>
                        <h3>All Users</h3>
                        <p class="muted">Manage login accounts and school memberships.</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>School Memberships</th>
                            <th>Account Status</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>

                            <td>
                                <strong th:text="${user.username}"></strong>
                            </td>

                            <td>
                                <span class="small-tag"
                                      th:text="${membershipCounts.get(user.id) != null
                                      ? membershipCounts.get(user.id) : 0}">
                                </span>
                            </td>

                            <td>
                                <span th:if="${user.enabled}"
                                      class="status-badge status-present">Active</span>
                                <span th:unless="${user.enabled}"
                                      class="status-badge status-absent">Inactive</span>
                            </td>

                            <td th:text="${user.createdAt != null
                                ? #temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')
                                : '-'}"></td>

                            <td>
                                <div class="action-buttons">
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                                       class="btn btn-light btn-small">Edit</a>

                                    <a th:href="@{/admin/users/reset-password/{id}(id=${user.id})}"
                                       class="btn btn-light btn-small">Reset Password</a>

                                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}"
                                          method="post" class="inline-form">

                                        <input type="hidden" name="enabled"
                                               th:value="${!user.enabled}">

                                        <button type="submit"
                                                th:class="${user.enabled}
                                                ? 'btn btn-danger btn-small'
                                                : 'btn btn-primary btn-small'"
                                                th:text="${user.enabled}
                                                ? 'Deactivate' : 'Activate'">
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="muted" style="text-align:center;">
                                No users found.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
