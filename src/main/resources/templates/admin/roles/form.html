
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Form | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div th:replace="~{fragments/topbar :: topbar('Role Management')}"></div>

        <section class="page-content">

            <div class="welcome-row">
                <div>
                    <h2 th:text="${pageHeading}">Create Role</h2>
                    <p class="muted">
                        Enter the role name and its description.
                    </p>
                </div>

                <a th:href="@{/admin/roles}" class="btn btn-light">
                    Back to Roles
                </a>
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <section class="panel form-panel">

                <form th:action="@{${formAction}}" method="post" data-validate="true">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="roleName">Role Name *</label>

                            <input type="text"
                                   id="roleName"
                                   name="roleName"
                                   th:value="${role.roleName}"
                                   placeholder="Example: ACCOUNTANT"
                                   maxlength="60"
                                   required>

                            <small class="muted">
                                ROLE_ is added automatically if omitted.
                                Use letters, numbers and underscores.
                            </small>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>

                            <textarea id="description"
                                      name="description"
                                      rows="4"
                                      maxlength="300"
                                      placeholder="Describe the responsibilities of this role."
                                      th:text="${role.description}">
                            </textarea>
                        </div>

                    </div>

                    <div class="form-actions">

                        <button type="submit" class="btn btn-primary">
                            Save Role
                        </button>

                        <a th:href="@{/admin/roles}"
                           class="btn btn-light">
                            Cancel
                        </a>

                    </div>

                </form>

            </section>

        </section>

            <div th:replace="~{fragments/footer :: developerFooter}"></div>
    </main>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
