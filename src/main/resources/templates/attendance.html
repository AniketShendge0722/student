<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar('Attendance')}"></div>
        <section class="page-content">
            <div class="page-heading">
                <div><h2>Attendance Management</h2><p class="muted">Record and review daily student attendance.</p></div>
                <a class="btn btn-primary" th:href="@{/attendance/add}">＋ Mark Attendance</a>
                <a class="btn btn-light" th:href="@{/attendance/bulk}"><i class="icon-users"></i> Bulk Attendance</a>
            </div>

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <section class="stats-grid stats-grid-compact">
                <article class="stat-card">
                    <div class="stat-label">Total Records</div>
                    <div class="stat-value" th:text="${totalAttendance}">0</div>
                </article>
                <article class="stat-card">
                    <div class="stat-label">Present</div>
                    <div class="stat-value text-green" th:text="${presentCount}">0</div>
                </article>
                <article class="stat-card">
                    <div class="stat-label">Absent</div>
                    <div class="stat-value text-red" th:text="${absentCount}">0</div>
                </article>
                <article class="stat-card">
                    <div class="stat-label">Late</div>
                    <div class="stat-value text-orange" th:text="${lateCount}">0</div>
                </article>
            </section>

            <section class="panel form-panel">
                <form method="get" th:action="@{/attendance}" class="filter-bar">
                    <input type="date" name="date" th:value="${selectedDate}">
                    <select name="studentId">
                        <option value="">All students</option>
                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:selected="${selectedStudentId != null and selectedStudentId == student.id}"
                                th:text="${student.name + ' (' + student.rollNo + ')'}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/attendance}" class="btn btn-light">Reset</a>
                </form>
            </section>

            <section class="panel form-panel" th:if="${attendanceDTO != null}">
                <h3 class="form-section-title"
                    th:text="${attendanceDTO.id == null ? 'Mark Attendance' : 'Edit Attendance'}">Attendance Form</h3>
                <form th:action="${attendanceDTO.id == null ? '/attendance/save' : '/attendance/update/' + attendanceDTO.id}"
                      th:object="${attendanceDTO}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Student *</label>
                            <select th:field="*{studentId}" required>
                                <option value="">Select student</option>
                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.name + ' (' + student.rollNo + ')'}"></option>
                            </select>
                            <small class="field-error" th:errors="*{studentId}"></small>
                        </div>
                        <div class="form-group">
                            <label>Date *</label>
                            <input type="date" th:field="*{date}" required>
                            <small class="field-error" th:errors="*{date}"></small>
                        </div>
                        <div class="form-group">
                            <label>Status *</label>
                            <select th:field="*{status}" required>
                                <option value="">Select status</option>
                                <option th:each="status : ${attendanceStatuses}"
                                        th:value="${status}" th:text="${status}"></option>
                            </select>
                            <small class="field-error" th:errors="*{status}"></small>
                        </div>
                        <div class="form-group full-width">
                            <label>Remarks</label>
                            <textarea th:field="*{remarks}" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/attendance}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Attendance</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <div class="table-responsive">
                    <table>
                        <thead>
                        <tr><th>#</th><th>Student</th><th>Roll No.</th><th>Class</th><th>Date</th><th>Status</th><th>Remarks</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, stat : ${attendanceList}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${item.student != null ? item.student.name : '-'}">Student</td>
                            <td th:text="${item.student != null ? item.student.rollNo : '-'}">ST001</td>
                            <td th:text="${item.student != null ? item.student.className : '-'}">10</td>
                            <td th:text="${item.date}">2026-11-20</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${item.status != null ? ' status-' + #strings.toLowerCase(item.status.name()) : ''}"
                                      th:text="${item.status}">PRESENT</span>
                            </td>
                            <td th:text="${item.remarks}">-</td>
                            <td class="action-cell">
                                <a class="btn btn-small btn-light"
                                   th:href="@{/attendance/edit/{id}(id=${item.id})}">Edit</a>
                                <form th:action="@{/attendance/delete/{id}(id=${item.id})}"
                                      method="post" class="inline-form"
                                      onsubmit="return confirmDelete('Delete this attendance record?')">
                                    <button class="btn btn-small btn-danger" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(attendanceList)}">
                            <td colspan="8" class="empty-state">No attendance records found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>

        <div th:replace="~{fragments/footer :: developerFooter}"></div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
