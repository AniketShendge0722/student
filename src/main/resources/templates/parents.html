<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar('Parents')}"></div>
        <section class="page-content">
            <div class="page-heading">
                <div><h2>Parent Management</h2><p class="muted">Manage parent and guardian details.</p></div>
                <a class="btn btn-primary" th:href="@{/parents/add}">＋ Add Parent</a>
            </div>

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form method="get" th:action="@{/parents}" class="filter-bar">
                <input type="search" name="keyword" placeholder="Search parents..."
                       th:value="${keyword}">
                <button class="btn btn-primary" type="submit">Search</button>
                <a class="btn btn-light" th:href="@{/parents}">Reset</a>
            </form>

            <section class="panel form-panel" th:if="${parentDTO != null}">
                <h3 class="form-section-title"
                    th:text="${parentDTO.id == null ? 'Add Parent' : 'Edit Parent'}">Parent Form</h3>

                <form th:action="${parentDTO.id == null ? '/parents/save' : '/parents/update/' + parentDTO.id}"
                      th:object="${parentDTO}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Father Name</label>
                            <input type="text" th:field="*{fatherName}" required>
                            <small class="field-error" th:errors="*{fatherName}"></small>
                        </div>
                        <div class="form-group">
                            <label>Mother Name</label>
                            <input type="text" th:field="*{motherName}" required>
                            <small class="field-error" th:errors="*{motherName}"></small>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" th:field="*{phone}" required>
                            <small class="field-error" th:errors="*{phone}"></small>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" th:field="*{email}">
                            <small class="field-error" th:errors="*{email}"></small>
                        </div>
                        <div class="form-group full-width">
                            <label>Address</label>
                            <textarea th:field="*{address}" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/parents}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Parent</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <div class="table-responsive">
                    <table>
                        <thead>
                        <tr><th>#</th><th>Father</th><th>Mother</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="parent, stat : ${parents}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${parent.fatherName}">Father</td>
                            <td th:text="${parent.motherName}">Mother</td>
                            <td th:text="${parent.phone}">9999999999</td>
                            <td th:text="${parent.email}">parent@example.com</td>
                            <td class="action-cell">
                                <a class="btn btn-small btn-light"
                                   th:href="@{/parents/edit/{id}(id=${parent.id})}">Edit</a>
                                <form th:action="@{/parents/delete/{id}(id=${parent.id})}"
                                      method="post" class="inline-form"
                                      onsubmit="return confirmDelete('Delete this parent?')">
                                    <button class="btn btn-small btn-danger" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(parents)}">
                            <td colspan="6" class="empty-state">No parent records found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
