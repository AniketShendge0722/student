
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | SchoolTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/topbar :: topbar('Add Student')}"></div>

        <section class="page-content">
            <div class="page-heading">
                <div>
                    <h2>Register Student</h2>
                    <p class="muted">Enter student information below.</p>
                </div>
                <a class="btn btn-light" th:href="@{/students}">
                    ← Back to Students
                </a>
            </div>

            <form th:action="@{/students/save}"
                  th:object="${studentDTO}"
                  method="post"
                  class="panel form-panel">

                <div class="alert alert-error"
                     th:if="${#fields.hasAnyErrors()}">
                    Please correct the highlighted fields.
                </div>

                <div class="alert alert-error"
                     th:if="${errorMessage != null}"
                     th:text="${errorMessage}">
                </div>

                <h3 class="form-section-title">Personal Information</h3>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Student Name *</label>
                        <input type="text" th:field="*{name}" required>
                        <small class="field-error" th:errors="*{name}"></small>
                    </div>

                    <div class="form-group">
                        <label>Roll Number *</label>
                        <input type="text" th:field="*{rollNo}" required>
                        <small class="field-error" th:errors="*{rollNo}"></small>
                    </div>

                    <select th:field="*{className}" required>
                        <option value="">Select Class</option>
                        <option th:each="schoolClass : ${classes}"
                                th:value="${schoolClass.className}"
                                th:text="${schoolClass.className}">
                        </option>
                    </select>

                    <div class="form-group">
                        <label>Gender *</label>
                        <select th:field="*{gender}" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <small class="field-error" th:errors="*{gender}"></small>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" th:field="*{dob}" required>
                        <small class="field-error" th:errors="*{dob}"></small>
                    </div>

                    <div class="form-group">
                        <label>Admission Date *</label>
                        <input type="date" th:field="*{admissionDate}" required>
                        <small class="field-error" th:errors="*{admissionDate}"></small>
                    </div>
                </div>

                <h3 class="form-section-title">Contact Information</h3>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" th:field="*{phone}">
                        <small class="field-error" th:errors="*{phone}"></small>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}">
                        <small class="field-error" th:errors="*{email}"></small>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea th:field="*{address}" rows="3"></textarea>
                    </div>
                </div>

                <h3 class="form-section-title">Parent & Transport Assignment</h3>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Parent</label>
                        <select th:field="*{parentId}">
                            <option value="">Select parent</option>
                            <option th:each="parent : ${parents}"
                                    th:value="${parent.id}"
                                    th:text="${parent.fatherName + ' / ' + parent.motherName}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>School Bus</label>
                        <select th:field="*{busId}">
                            <option value="">Select bus</option>
                            <option th:each="bus : ${buses}"
                                    th:value="${bus.id}"
                                    th:text="${bus.busNumber}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Active Student</label>
                        <select th:field="*{active}">
                            <option th:value="true">Active</option>
                            <option th:value="false">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-light" th:href="@{/students}">
                        Cancel
                    </a>
                    <button class="btn btn-primary" type="submit">
                        Save Student
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
